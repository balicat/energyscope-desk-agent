name: evals

# The offline gate: frozen data, a scripted stand-in for the model, no lake and no API key.
# It proves the tools, the arithmetic, the validator and the evaluators still agree with the
# recorded answers, and that the suite still catches a wrong number when the validator is off.
on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Suite on frozen data, answers must match the golden file
        run: python run_evals.py --source fixture --gate --golden check
      - name: Prose control, wrong sentences over true tables must all be rejected
        run: LIBRARIAN_TODAY=$(python -c "import json;print(json.load(open('fixtures/series.json'))['as_of'])") python prose_controls.py
      - name: Excel control, errors planted in true sheets must all be reported
        run: LIBRARIAN_TODAY=$(python -c "import json;print(json.load(open('fixtures/series.json'))['as_of'])") python excel_controls.py
      - name: Fact control, a fact may be dropped only when a cited reading carries it
        run: python fact_controls.py
      - name: Engine control, the server readings refuse unlike spreads and their check re-reads the signals' inputs
        run: LIBRARIAN_TODAY=$(python -c "import json;print(json.load(open('fixtures/series.json'))['as_of'])") python engine_controls.py
      # Four since the Excel sheets (19 Nov 2026): the planted wrong price also makes its sheet fail to reproduce.
      - name: Control run, validator off, exactly four assertions must fail
        run: python run_evals.py --source fixture --no-guard --expect-failures 4
